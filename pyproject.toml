[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard"]

[project]
name = "enchanted-composer"
version = "0.2.0"
description = "Plugin-owned Enchanted Composer for Hermes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1"]
license = "MIT"
authors = [{ name = "Zero2" }]

[project.urls]
Homepage = "https://github.com/noxius-studium/enchanted-composer"
Repository = "https://github.com/noxius-studium/enchanted-composer"

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.8,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
"dashboard/__init__.py" = ["N999"]
