<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" font-family="system-ui,sans-serif"><rect width="100%" height="100%" fill="#fafafa"/><text x="20" y="26" font-size="14" font-weight="600" fill="#1c1e21">Review views (EC-R03 geometry fixture — not live-host acceptance)</text><text x="20" y="44" font-size="9" fill="#5c6166">Scripted helper reply; marks use the host active-selection token in the product. Attention rows carry text labels, never color alone.</text><rect x="20" y="60" width="230" height="280" rx="8" fill="#ffffff" stroke="#d7dade"/><text x="32" y="82" font-size="11" font-weight="600" fill="#1c1e21">Proposed (selected changes marked)</text><rect x="32" y="96" width="206" height="60" rx="4" fill="#eef1f4"/><text x="40" y="114" font-size="9" fill="#1c1e21">Compose a summary. Do not</text><text x="40" y="128" font-size="9" fill="#1c1e21">deploy. Count 3 items.</text><rect x="40" y="104" width="52" height="12" fill="none" stroke="#1c1e21" stroke-dasharray="2 2"/><text x="32" y="176" font-size="8" fill="#5c6166">Preview recomputes the actual</text><text x="32" y="188" font-size="8" fill="#5c6166">combination of selected changes.</text><rect x="32" y="290" width="80" height="22" rx="6" fill="#eef1f4"/><text x="40" y="305" font-size="9" fill="#1c1e21">Apply selected</text><rect x="120" y="290" width="56" height="22" rx="6" fill="#eef1f4"/><text x="128" y="305" font-size="9" fill="#1c1e21">Apply all</text><rect x="265" y="60" width="230" height="280" rx="8" fill="#ffffff" stroke="#d7dade"/><text x="277" y="82" font-size="11" font-weight="600" fill="#1c1e21">Changes (attention first)</text><rect x="277" y="96" width="206" height="44" rx="4" fill="#ffffff" stroke="#d7dade"/><rect x="285" y="104" width="10" height="10" fill="#eef1f4" stroke="#1c1e21"/><text x="302" y="113" font-size="8.5" fill="#1c1e21">⚠ Removed a restriction</text><text x="302" y="127" font-size="7.5" fill="#5c6166">needs attention · inferred description</text><rect x="277" y="148" width="206" height="44" rx="4" fill="#ffffff" stroke="#d7dade"/><rect x="285" y="156" width="10" height="10" fill="#eef1f4" stroke="#1c1e21"/><text x="302" y="165" font-size="8.5" fill="#1c1e21">⚠ Changed a number, path, or identifier</text><text x="302" y="179" font-size="7.5" fill="#5c6166">needs attention · inferred description</text><rect x="277" y="200" width="206" height="44" rx="4" fill="#ffffff" stroke="#d7dade"/><rect x="285" y="208" width="10" height="10" fill="#eef1f4" stroke="#1c1e21"/><text x="302" y="217" font-size="8.5" fill="#1c1e21">Reworded passage</text><text x="302" y="231" font-size="7.5" fill="#5c6166">inferred description</text><text x="277" y="270" font-size="8" fill="#5c6166">Descriptions are inferred from the diff,</text><text x="277" y="282" font-size="8" fill="#5c6166">not semantic analysis.</text><rect x="510" y="60" width="230" height="280" rx="8" fill="#ffffff" stroke="#d7dade"/><text x="522" y="82" font-size="11" font-weight="600" fill="#1c1e21">Original</text><rect x="522" y="96" width="206" height="60" rx="4" fill="#eef1f4"/><text x="530" y="114" font-size="9" fill="#1c1e21">Write a summary. Do not</text><text x="530" y="128" font-size="9" fill="#1c1e21">deploy. Count 3 items.</text><text x="522" y="176" font-size="8" fill="#5c6166">Stale draft? “Your draft changed.</text><text x="522" y="188" font-size="8" fill="#5c6166">Compare before applying.” with</text><text x="522" y="200" font-size="8" fill="#5c6166">Compare / Copy proposal / Cancel.</text></svg>