name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Install test dependencies
        run: uv sync --locked --extra test
      - name: Verify generated artifacts
        run: |
          uv run python scripts/build_desktop.py --check
          uv run python scripts/build_dashboard.py --check
      - name: Test JavaScript
        run: node --test tests/desktop/*.test.mjs tests/dashboard/*.test.mjs
      - name: Test Python
        run: uv run python -m pytest -q
      - name: Lint Python
        run: uv run python -m ruff check dashboard tests scripts
      - name: Verify Desktop surface
        run: node scripts/verify_desktop.mjs desktop/plugin.js
      - name: Build deterministic release twice
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import pathlib; print(next(line.split(":",1)[1].strip().split()[0] for line in pathlib.Path("plugin.yaml").read_text(encoding="utf-8").splitlines() if line.startswith("version:")))')"
          uv run python scripts/package.py --output "dist/enchanted-composer-${VERSION}-a.zip"
          uv run python scripts/package.py --output "dist/enchanted-composer-${VERSION}-b.zip"
          cmp "dist/enchanted-composer-${VERSION}-a.zip" "dist/enchanted-composer-${VERSION}-b.zip"
