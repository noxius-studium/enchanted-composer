name: Release package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: enchanted-composer-main-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6

      - name: Resolve automatic release version
        id: identity
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ -n "${APPROVED_SHA}" && "${APPROVED_SHA}" != "${MAIN_SHA}" ]]; then
            echo "CI-approved ${APPROVED_SHA} was superseded by main ${MAIN_SHA}; the newer CI run owns publication."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git checkout -B main origin/main

          VERSION="$(python -c 'from pathlib import Path; from scripts.prepare_auto_release import read_version; print(read_version(Path.cwd()))')"
          TAG="v${VERSION}"
          HEAD_SHA="$(git rev-parse HEAD)"

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_SHA}" != "${HEAD_SHA}" ]]; then
              VERSION="$(VERSION="${VERSION}" python -c 'import os; major,minor,patch=map(int,os.environ["VERSION"].split(".")); print(f"{major}.{minor}.{patch+1}")')"
              while git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; do
                VERSION="$(VERSION="${VERSION}" python -c 'import os; major,minor,patch=map(int,os.environ["VERSION"].split(".")); print(f"{major}.{minor}.{patch+1}")')"
              done
              TAG="v${VERSION}"
              python scripts/prepare_auto_release.py "${VERSION}"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add README.md __init__.py dashboard/manifest.json docs/installation.md plugin.yaml pyproject.toml uv.lock
              git commit -m "chore(release): bump version to ${VERSION} [skip ci]"
              git push origin HEAD:main
              HEAD_SHA="$(git rev-parse HEAD)"
            fi
          fi

          {
            echo "publish=true"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "commit_sha=${HEAD_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install test dependencies
        if: steps.identity.outputs.publish == 'true'
        run: uv sync --locked --extra test

      - name: Verify release source
        if: steps.identity.outputs.publish == 'true'
        run: |
          uv run python scripts/build_desktop.py --check
          uv run python scripts/build_dashboard.py --check
          node --test tests/desktop/*.test.mjs tests/dashboard/*.test.mjs
          uv run python -m pytest -q
          uv run python -m ruff check dashboard tests scripts
          node scripts/verify_desktop.mjs desktop/plugin.js

      - name: Build SHA-identified release
        if: steps.identity.outputs.publish == 'true'
        id: release
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "${ACTUAL_SHA}" != "${COMMIT_SHA}" ]]; then
            echo "Release identity drifted from ${COMMIT_SHA} to ${ACTUAL_SHA}." >&2
            exit 1
          fi
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          ARCHIVE="enchanted-composer-${VERSION}-${SHORT_SHA}.zip"
          uv run python scripts/package.py --output "dist/${ARCHIVE}"
          cd dist
          sha256sum "${ARCHIVE}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          VERSION="${VERSION}" COMMIT_SHA="${COMMIT_SHA}" SHORT_SHA="${SHORT_SHA}" ARCHIVE="${ARCHIVE}" ARCHIVE_SHA256="$(cut -d ' ' -f1 SHA256SUMS)" \
            python -c 'import json,os,pathlib; pathlib.Path("RELEASE-METADATA.json").write_text(json.dumps({"version":os.environ["VERSION"],"commit":os.environ["COMMIT_SHA"],"short_commit":os.environ["SHORT_SHA"],"archive":os.environ["ARCHIVE"],"sha256":os.environ["ARCHIVE_SHA256"]},indent=2)+"\n",encoding="utf-8")'
          {
            echo "short_sha=${SHORT_SHA}"
            echo "archive=${ARCHIVE}"
            echo "artifact_name=enchanted-composer-${VERSION}-${SHORT_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload verified workflow artifact
        if: steps.identity.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            dist/${{ steps.release.outputs.archive }}
            dist/SHA256SUMS
            dist/RELEASE-METADATA.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish automatic GitHub release
        if: steps.identity.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_SHA}" != "${COMMIT_SHA}" ]]; then
              echo "${TAG} points to ${TAG_SHA}, not ${COMMIT_SHA}." >&2
              exit 1
            fi
          else
            git tag -a "${TAG}" "${COMMIT_SHA}" -m "Enchanted Composer ${TAG}"
            git push origin "${TAG}"
          fi
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" --verify-tag --target "${COMMIT_SHA}" --title "Enchanted Composer ${VERSION}" --generate-notes
          gh release upload "${TAG}" \
            "dist/${ARCHIVE}" \
            "dist/SHA256SUMS" \
            "dist/RELEASE-METADATA.json" \
            --clobber
