name: Propose Hermes catalog update

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published Enchanted Composer tag to propose (blank = latest release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HERMES_CATALOG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require catalog pull-request token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Add a HERMES_CATALOG_TOKEN Actions secret with access to the Deadtrix21/hermes-agent fork and public pull requests." >&2
            exit 1
          fi

      - name: Resolve published release
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG}"
          if [[ -z "${TAG}" ]]; then
            TAG="$(gh release list --repo noxius-studium/enchanted-composer --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          gh release view "${TAG}" --repo noxius-studium/enchanted-composer >/dev/null
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag ${TAG} is not v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          SHA="$(git rev-list -n 1 "${TAG}")"
          if [[ ! "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve ${TAG} to a full commit SHA." >&2
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "sha=${SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Update catalog fork and open review PR
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="catalog/enchanted-composer-v${VERSION}"
          gh repo clone Deadtrix21/hermes-agent catalog
          cd catalog
          git remote set-url upstream https://github.com/NousResearch/hermes-agent.git 2>/dev/null || git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main
          git checkout -B "${BRANCH}" upstream/main

          ENTRY="plugin-catalog/enchanted-composer.yaml"
          OLD_SHA="$(python -c 'import pathlib,re; text=pathlib.Path("plugin-catalog/enchanted-composer.yaml").read_text(); print(re.search(r"^sha:\\s*([0-9a-f]{40})\\s*$",text,re.M).group(1))')"
          OLD_VERSION="$(python -c 'import pathlib,re; text=pathlib.Path("plugin-catalog/enchanted-composer.yaml").read_text(); print(re.search(r"^version:\\s*\"([^\"]+)\"\\s*$",text,re.M).group(1))')"
          python "${GITHUB_WORKSPACE}/scripts/update_hermes_catalog_entry.py" "${ENTRY}" --version "${VERSION}" --sha "${RELEASE_SHA}"

          git config user.name "Deadtrix21"
          git config user.email "41898282+Deadtrix21@users.noreply.github.com"
          git add "${ENTRY}"
          git diff --cached --check
          git commit -m "chore(plugin-catalog): update enchanted-composer to ${VERSION}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Deadtrix21/hermes-agent.git"
          git push --force origin "HEAD:${BRANCH}"

          BODY_FILE="${RUNNER_TEMP}/enchanted-composer-catalog-pr.md"
          printf '%s\n' \
            '## Summary' \
            "- update \`enchanted-composer\` from ${OLD_VERSION} to ${VERSION}" \
            "- re-pin the reviewed source from \`${OLD_SHA}\` to \`${RELEASE_SHA}\`" \
            '- re-pin README, banner, and screenshot URLs to the same exact commit' \
            '' \
            '## Release evidence' \
            "- Release: https://github.com/noxius-studium/enchanted-composer/releases/tag/${RELEASE_TAG}" \
            "- Source comparison: https://github.com/noxius-studium/enchanted-composer/compare/${OLD_SHA}...${RELEASE_SHA}" \
            '' \
            'This PR only proposes the catalog pin update. Nous maintainer review and catalog CI remain the publication gate.' \
            > "${BODY_FILE}"

          EXISTING="$(gh pr list --repo NousResearch/hermes-agent --state open --head "Deadtrix21:${BRANCH}" --json url --jq '.[0].url // empty')"
          if [[ -n "${EXISTING}" ]]; then
            gh pr edit "${EXISTING}" --repo NousResearch/hermes-agent \
              --title "chore(plugin-catalog): update enchanted-composer to ${VERSION}" \
              --body-file "${BODY_FILE}"
            echo "Updated ${EXISTING}"
          else
            gh pr create --repo NousResearch/hermes-agent --base main --head "Deadtrix21:${BRANCH}" \
              --title "chore(plugin-catalog): update enchanted-composer to ${VERSION}" \
              --body-file "${BODY_FILE}"
          fi
